name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy tokenizers onnxruntime

      - name: Run Tests
        run: |
          PYTHONPATH=src pytest tests/

  publish:
    name: Build and Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher authentication
      contents: write  # Required to commit the bumped version back to repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Increment Version
        run: |
          python scripts/increment_version.py

      - name: Build Package
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit version bump back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          # git commit will exit successfully if there are no changes, or commit if changes are present
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump version [skip ci]" && git push)
