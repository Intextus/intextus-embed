[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intextus-embed"
version = "0.1.2"
description = "A lightweight, zero-PyTorch ONNX encoder for generic ColBERT models."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "colbert",
    "late-interaction",
    "onnx",
    "onnxruntime",
    "embedding",
    "search",
    "information-retrieval",
    "vector-search",
    "zero-pytorch",
    "modernbert"
]
dependencies = [
    "onnxruntime>=1.16.0",
    "tokenizers>=0.19.0",
    "numpy>=1.22.0"
]

[project.scripts]
intextus-export = "intextus.export:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["intextus"]
