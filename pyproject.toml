[build-system]
requires = ["scikit-build-core>=0.5.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "limbed-py"
version = "0.1.6"
description = "A lightweight, zero-PyTorch ONNX encoder for generic ColBERT models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "colbert",
    "late-interaction",
    "onnx",
    "onnxruntime",
    "embedding",
    "search",
    "information-retrieval",
    "vector-search",
    "zero-pytorch",
    "modernbert"
]
dependencies = [
    "numpy>=1.22.0",
    "huggingface-hub>=0.16.4"
]

[tool.scikit-build]
cmake.build-type = "Release"
# This tells scikit-build-core to look inside the 'src' directory for your python packages
wheel.packages = ["src/limbed"]
sdist.include = ["src/limbed/*", "CMakeLists.txt"]